<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pasatiempos · Sudoku horizontal (oscuro)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#43C9B3}a:hover{color:#6FE0CC}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; padding: 40px; background: #0E151D; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #F0F4F8; display: flex; align-items: center; gap: 40px">

<div style="display: grid; grid-template-columns: repeat(9, 76px); border: 3px solid #7D8D9E; border-radius: 12px; overflow: hidden; background: #16202B; flex: none">
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="81">
<button type="button" aria-label="{{cell.label}}" onClick="{{cell.pick}}" style="{{cell.style}}">
<sc-if value="{{cell.hasValue}}" hint-placeholder-val="{{ true }}">{{cell.v}}</sc-if>
<sc-if value="{{cell.hasNotes}}" hint-placeholder-val="{{ false }}"><span style="{{notesStyle}}"><sc-for list="{{cell.notes}}" as="n" hint-placeholder-count="9"><span style="{{noteStyle}}">{{n}}</span></sc-for></span></sc-if>
</button>
</sc-for>
</div>

<div style="flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: space-between">
<header style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Home-C.dc.html" style="height: 56px; padding: 0 20px 0 12px; border-radius: 28px; background: #16202B; display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; text-decoration: none"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Inicio</a>
<button type="button" aria-label="Pausa" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: #16202B; color: #F0F4F8; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg></button>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 30px; font-weight: 700">Sudoku</h1>
<span style="font-size: 18px; color: #A9B6C3">Medio</span>
</div>
<span style="font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums">04:12</span>
</div>
</header>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" style="height: 72px; border-radius: 20px; border: 0; background: #16202B; color: #F0F4F8; font-family: inherit; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Deshacer</button>
<button type="button" style="height: 72px; border-radius: 20px; border: 0; background: #16202B; color: #F0F4F8; font-family: inherit; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9l-5-5a2 2 0 0 1 0-3l8-8a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 8"/><path d="M9 8l7 7"/></svg>Borrar</button>
<button type="button" aria-pressed="true" style="height: 72px; border-radius: 20px; border: 3px solid #43C9B3; background: #173A3A; color: #6FE0CC; font-family: inherit; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/></svg>Notas: sí</button>
<button type="button" style="height: 72px; border-radius: 20px; border: 0; background: #16202B; color: #F0F4F8; font-family: inherit; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>Pista</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{nums}}" as="n" hint-placeholder-count="9">
<button type="button" aria-label="{{n.label}}" style="height: 96px; border-radius: 18px; border: 0; background: #16202B; color: #6FE0CC; font-family: inherit; font-size: 46px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{n.d}}</button>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 40 }; }
  renderVals() {
    const T = { cell: '#16202B', sel: '#1F5552', hl: '#1C2A38', same: '#1D4240', text: '#F0F4F8', user: '#6FE0CC', sub: '#A9B6C3', line: '#2A3644', box: '#7D8D9E', font: "'Atkinson Hyperlegible', system-ui, sans-serif", size: '44px' };
    const giv = '530070000600195000098000060800060003400803001700020006060000280000419005000080079';
    const usr = { 2: 4, 3: 6, 10: 7, 18: 1, 28: 5, 37: 2, 46: 1 };
    const notes = { 5: [1, 2, 8], 16: [2, 3, 4], 42: [5, 7, 9], 54: [3, 9] };
    const sel = this.state.sel;
    const sr = Math.floor(sel / 9), sc = sel % 9, sb = Math.floor(sr / 3) * 3 + Math.floor(sc / 3);
    const val = (i) => giv[i] !== '0' ? giv[i] : (usr[i] ? String(usr[i]) : '');
    const sv = val(sel);
    const cells = [];
    for (let i = 0; i < 81; i++) {
      const r = Math.floor(i / 9), c = i % 9, b = Math.floor(r / 3) * 3 + Math.floor(c / 3);
      const v = val(i), given = giv[i] !== '0';
      let bg = T.cell;
      if (i === sel) bg = T.sel; else if (sv && v === sv) bg = T.same; else if (r === sr || c === sc || b === sb) bg = T.hl;
      const n = notes[i] || [];
      cells.push({
        v: v, hasValue: !!v, hasNotes: !v && n.length > 0,
        notes: [1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => n.indexOf(d) >= 0 ? String(d) : ''),
        label: 'Fila ' + (r + 1) + ', columna ' + (c + 1) + (v ? ', ' + v : ', vacía'),
        pick: () => this.setState({ sel: i }),
        style: {
          width: '76px', height: '76px', boxSizing: 'border-box', padding: 0, margin: 0, border: 0,
          borderRight: c === 8 ? '0' : (c % 3 === 2 ? '3px solid ' + T.box : '1px solid ' + T.line),
          borderBottom: r === 8 ? '0' : (r % 3 === 2 ? '3px solid ' + T.box : '1px solid ' + T.line),
          background: bg, color: given ? T.text : T.user, fontFamily: T.font, fontSize: T.size, fontWeight: 700,
          display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer'
        }
      });
    }
    const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => ({ d: String(d), label: 'Escribir ' + d }));
    return {
      cells: cells, nums: nums,
      notesStyle: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gridTemplateRows: 'repeat(3, 1fr)', width: '100%', height: '100%', padding: '4px', boxSizing: 'border-box' },
      noteStyle: { fontSize: '17px', lineHeight: '1', fontWeight: 700, color: T.sub, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: T.font }
    };
  }
}
</script>
</body>
</html>
