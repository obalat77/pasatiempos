<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pasatiempos · Cálculos cruzados vertical (oscuro)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#43C9B3}a:hover{color:#6FE0CC}
</style>
</helmet>
<div style="width: 820px; height: 1180px; box-sizing: border-box; padding: 44px 48px 52px; background: #0E151D; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #F0F4F8; display: flex; flex-direction: column; justify-content: space-between">

<header style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
<a href="Home-C.dc.html" style="justify-self: start; height: 56px; padding: 0 20px 0 12px; border-radius: 28px; background: #16202B; display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; text-decoration: none"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Inicio</a>
<div style="justify-self: center; display: flex; flex-direction: column; align-items: center">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; white-space: nowrap">Cálculos cruzados</h1>
<span style="font-size: 18px; color: #A9B6C3">Fácil</span>
</div>
<span style="justify-self: end; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums">02:40</span>
</header>

<p style="margin: 0; font-size: 21px; text-align: center">Coloca los números para que <strong>todas las cuentas</strong> sean correctas.</p>

<div style="align-self: center; display: grid; grid-template-columns: repeat(7, 88px); gap: 6px">
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="49">
<button type="button" aria-label="{{cell.label}}" onClick="{{cell.pick}}" style="{{cell.style}}">{{cell.v}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; align-items: center">
<span style="font-size: 19px; color: #A9B6C3">Toca una casilla vacía y después un número:</span>
<div style="display: flex; gap: 14px">
<sc-for list="{{tray}}" as="n" hint-placeholder-count="4">
<button type="button" aria-label="{{n.label}}" onClick="{{n.pick}}" style="{{n.style}}">{{n.v}}</button>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<button type="button" onClick="{{undo}}" style="height: 76px; border-radius: 20px; border: 0; background: #16202B; color: #F0F4F8; font-family: inherit; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Deshacer</button>
<button type="button" onClick="{{erase}}" style="height: 76px; border-radius: 20px; border: 0; background: #16202B; color: #F0F4F8; font-family: inherit; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9l-5-5a2 2 0 0 1 0-3l8-8a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 8"/><path d="M9 8l7 7"/></svg>Borrar</button>
<button type="button" style="height: 76px; border-radius: 20px; border: 0; background: #16202B; color: #F0F4F8; font-family: inherit; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>Pista</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 14, placed: { 2: '4' }, last: [] }; }
  renderVals() {
    const T = { cell: '#16202B', text: '#F0F4F8', op: '#A9B6C3', user: '#6FE0CC', blank: '#43C9B3', sel: '#1F5552', result: '#1C2A38', border: '#3A4A5A', bad: '#C62828' };
    const layout = [
      ['3', '+', '?', '−', '2', '=', '5'],
      ['+', '', '−', '', '+', '', ''],
      ['?', '×', '1', '+', '?', '=', '11'],
      ['−', '', '+', '', '−', '', ''],
      ['2', '+', '?', '−', '?', '=', '6'],
      ['=', '', '=', '', '=', '', ''],
      ['6', '', '10', '', '5', '', '']
    ];
    const answer = { 2: '4', 14: '5', 18: '6', 30: '7', 32: '3' };
    const pool = ['3', '4', '5', '6', '7'];
    const st = this.state;
    const used = Object.values(st.placed);
    const isOp = (v) => ['+', '−', '×', '÷', '='].indexOf(v) >= 0;
    const base = { width: '88px', height: '88px', boxSizing: 'border-box', padding: 0, margin: 0, borderRadius: '14px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Atkinson Hyperlegible', system-ui, sans-serif", fontWeight: 700 };
    const cells = [];
    layout.forEach((row, r) => row.forEach((v, c) => {
      const i = r * 7 + c;
      const isResult = r === 6 || c === 6;
      let style, val = v, label = v, pick = () => {};
      if (v === '') { style = Object.assign({}, base, { background: 'transparent', border: 0 }); label = ''; }
      else if (v === '?') {
        val = st.placed[i] || '';
        const wrong = val && val !== answer[i];
        style = Object.assign({}, base, { fontSize: '44px', background: i === st.sel ? T.sel : T.cell, border: val ? '2px solid ' + T.border : '3px dashed ' + T.blank, color: wrong ? T.bad : T.user, cursor: 'pointer' });
        label = val ? 'Casilla con ' + val : 'Casilla vacía';
        pick = () => this.setState({ sel: i });
      }
      else if (isOp(v)) { style = Object.assign({}, base, { fontSize: '38px', background: 'transparent', border: 0, color: T.op }); label = v === '=' ? 'igual' : v; }
      else { style = Object.assign({}, base, { fontSize: isResult ? '40px' : '44px', background: isResult ? T.result : T.cell, border: '2px solid ' + T.border, color: T.text }); }
      cells.push({ v: val, label: label, style: style, pick: pick });
    }));
    const left = pool.slice();
    used.forEach((u) => { const k = left.indexOf(u); if (k >= 0) left.splice(k, 1); });
    const tray = left.map((v) => ({
      v: v, label: 'Colocar ' + v,
      style: { width: '96px', height: '96px', borderRadius: '20px', border: '0', background: T.cell, color: T.user, fontFamily: "'Atkinson Hyperlegible', system-ui, sans-serif", fontSize: '46px', fontWeight: 700, cursor: 'pointer' },
      pick: () => { if (st.sel >= 0 && answer[st.sel] !== undefined && !st.placed[st.sel]) { const p = Object.assign({}, st.placed); p[st.sel] = v; this.setState({ placed: p, last: st.last.concat([st.sel]) }); } }
    }));
    const erase = () => { if (st.placed[st.sel]) { const p = Object.assign({}, st.placed); delete p[st.sel]; this.setState({ placed: p }); } };
    const undo = () => { if (st.last.length) { const k = st.last[st.last.length - 1]; const p = Object.assign({}, st.placed); delete p[k]; this.setState({ placed: p, last: st.last.slice(0, -1), sel: k }); } };
    return { cells: cells, tray: tray, erase: erase, undo: undo };
  }
}
</script>
</body>
</html>
